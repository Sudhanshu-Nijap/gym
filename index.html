<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Fitness | Membership</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e5ff; /* Neon cyan */
            --primary-glow: rgba(0, 229, 255, 0.5);
            --bg-color: #050505;
            --surface: rgba(10, 10, 15, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.8)),
                url('https://images.unsplash.com/photo-1518611012118-696072aa579a?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            height: 100vh; /* Enforce no scroll */
            overflow: hidden; /* Enforce no scroll */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .wrapper {
            width: 100%;
            max-width: 550px;
            position: relative;
            z-index: 1;
            /* Subtle floating animation */
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 35px 40px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02);
            position: relative;
        }

        /* Glowing accent bar at top of card */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            border-radius: 0 0 10px 10px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--surface-border);
            position: relative;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .tab::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
            transition: width 0.4s ease;
        }

        .tab.active {
            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .tab.active::after {
            width: 100%;
        }

        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(10px) scale(0.98);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* 2-Column layout to save vertical space */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding-left: 5px;
        }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--surface-border);
            color: white;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:hover, select:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1), inset 0 0 10px rgba(0, 229, 255, 0.05);
            background: rgba(0, 0, 0, 0.8);
        }

        select option {
            background: #111;
            color: white;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 10px;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        button:hover {
            background: #ffffff;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.4);
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Membership Card Styling - Ultra Premium */
        #membershipCard {
            display: none;
            margin-top: 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 18px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.1), 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        /* Animated glowing orb behind card */
        #membershipCard::after {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: var(--primary);
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
        }

        #membershipCard::before {
            content: 'PASS';
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 4rem;
            font-weight: 800;
            color: rgba(0, 229, 255, 0.05);
            pointer-events: none;
            letter-spacing: -2px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 2;
        }

        .detail-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .detail-value {
            font-weight: 600;
            font-size: 1.05rem;
            color: white;
            text-align: right;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        
        .status-badge {
            background: var(--primary);
            color: black;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Mobile Adjustments */
        @media (max-width: 500px) {
            body {
                background-attachment: scroll; /* Fixes mobile background zooming bug */
                height: 100%;
                min-height: 100vh;
                overflow: auto; /* Allow scrolling if content is taller than screen */
                padding: 20px 10px;
            }
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .card {
                padding: 25px 20px;
            }
            #membershipCard {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab('signup')">Sign Up</div>
                <div class="tab" onclick="switchTab('login')">Log In</div>
            </div>

            <!-- Registration Section -->
            <div id="signup" class="tab-content active">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="John Doe">
                    </div>
                    
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="age" placeholder="25">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Membership Tier</label>
                        <select id="plan">
                            <option value="">Select Plan...</option>
                            <option value="Basic">Basic - ₹1000/mo</option>
                            <option value="Standard">Standard - ₹1500/mo</option>
                            <option value="Premium">Premium - ₹2000/mo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Duration (Months)</label>
                        <input type="number" id="months" placeholder="e.g. 6">
                    </div>
                </div>

                <button id="paymentButton">Activate Membership</button>
            </div>

            <!-- Login Section -->
            <div id="login" class="tab-content">
                <div class="form-group" style="margin-bottom: 25px;">
                    <label>Registered Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter email to view card">
                </div>
                
                <button id="loginButton" style="margin-bottom: 10px;">View Pass</button>

                <div id="membershipCard">
                    <h3 style="color: var(--primary); margin-bottom: 15px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px;">Digital Pass</h3>
                    
                    <div class="detail-row">
                        <span class="detail-label">Name</span>
                        <span class="detail-value" id="displayName"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Plan</span>
                        <span class="detail-value" id="displayPlan"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Valid For</span>
                        <span class="detail-value"><span id="displayMonths"></span> Months</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value status-badge" id="displayMembership"></span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function switchTab(tabId) {
            // Tab active styling
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Hide old content and prepare for animation
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Show new content
            setTimeout(() => {
                document.getElementById(tabId).classList.add('active');
            }, 50);
            
            document.getElementById("membershipCard").style.display = "none";
        }

        const gymMembers = new Map();

        const planPrices = {
            Basic: 1000,
            Standard: 1500,
            Premium: 2000
        };

        const nameInput = document.getElementById("name");
        const ageInput = document.getElementById("age");
        const emailInput = document.getElementById("email");
        const planInput = document.getElementById("plan");
        const monthsInput = document.getElementById("months");
        
        const paymentButton = document.getElementById("paymentButton");
        const loginButton = document.getElementById("loginButton");
        const loginEmail = document.getElementById("loginEmail");
        const membershipCard = document.getElementById("membershipCard");

        paymentButton.addEventListener("click", function () {
            const name = nameInput.value;
            const age = ageInput.value;
            const email = emailInput.value.toLowerCase().trim();
            const plan = planInput.value;
            const months = Number(monthsInput.value);

            if (!name || !age || !email || !plan || !months) {
                alert("Please fill all details to activate your membership.");
                return;
            }

            const totalAmount = planPrices[plan] * months;

            gymMembers.set(email, {
                name: name,
                age: age,
                plan: plan,
                months: months,
                amount: totalAmount,
                payment: "Paid",
                membership: "Active"
            });

            // Automatically switch to login tab
            document.querySelectorAll('.tab')[1].click();
            loginEmail.value = email; 
            
            // Trigger login immediately for a magical user experience
            setTimeout(() => {
                loginButton.click();
            }, 300);
        });

        loginButton.addEventListener("click", function () {
            const email = loginEmail.value.toLowerCase().trim();

            if (!gymMembers.has(email)) {
                alert("No active membership found for this email.");
                membershipCard.style.display = "none";
                return;
            }

            const member = gymMembers.get(email);

            document.getElementById("displayName").textContent = member.name;
            document.getElementById("displayPlan").textContent = member.plan;
            document.getElementById("displayMonths").textContent = member.months;
            document.getElementById("displayMembership").textContent = member.membership;

            membershipCard.style.display = "block";
        });
    </script>
</body>
</html>
